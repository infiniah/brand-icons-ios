name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  ios:
    name: Build for iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          xcodebuild build \
            -scheme BrandIcons \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the example app
        run: |
          xcodebuild build \
            -project Examples/Applied/Applied.xcodeproj \
            -scheme Applied \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
